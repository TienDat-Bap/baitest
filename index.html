<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p style="display: none;">Xin chào</p>
    <button>click</button>
    <span></span>
    <script>
        var pElement = document.querySelector('p')
        var buttonEmlement = document.querySelector('button')
        var count = 0
        var color = ['red', 'blue', 'black']
        buttonEmlement.addEventListener('click',function (e) {
            if(pElement.style.display === 'none'){
                pElement.style.display = 'block'
            }else{
                pElement.style.display = 'none'
            }
            count ++;
            buttonEmlement.innerHTML = count 
            document.body.style.backgroundColor = color[count % color.length];
  })
    </script>
</body>
</html>
